name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'SchoolSignReminder-Android-Project.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Unpack Android project
        run: unzip -o SchoolSignReminder-Android-Project.zip -d source
      - name: Build debug APK
        working-directory: source/SchoolSignReminder
        run: gradle --no-daemon assembleDebug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SchoolSignReminder-debug-apk
          path: source/SchoolSignReminder/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
